volumes:
  mysql_data:

services:

  app:
    build: .
    restart: "no"
    mem_limit: 512M
    expose:
      - "9000"
    # Real env vars beat .env, so the container uses MySQL while host .env stays on SQLite.
    environment:
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8082}}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-real_estate}
      DB_USERNAME: ${DB_USERNAME:-homestead}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./:/var/www/html
      - ./development/upload.ini:/usr/local/etc/php/conf.d/upload.ini
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  site:
    image: nginx:stable-alpine
    restart: "no"
    mem_limit: 64M
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: "no"
    mem_limit: 1G
    ports:
      - "${FORWARD_DB_PORT:-3312}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-real_estate}
      MYSQL_USER: ${DB_USERNAME:-homestead}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

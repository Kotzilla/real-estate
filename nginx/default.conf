server {
    listen 80;
    fastcgi_read_timeout 300;
    proxy_read_timeout 300;
    client_max_body_size 10M;
    index index.php index.html;
    server_name _ localhost;
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    # Compress HTML, Livewire JSON and the theme's CSS/JS (a report page: 335 KB → 22 KB)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hardening
    server_tokens off;
    autoindex off;

    # Security Headers
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-XSS-Protection       "1; mode=block"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=()" always;

    # Block dot files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        return 403;
    }

    # Block PHP execution in storage and upload folders
    location ~* ^/storage/.*\.(php|php5|phtml|sh|py|pl|cgi)$ {
        deny all;
        return 403;
    }

    # Block direct access to sensitive storage subfolders
    location ~* ^/storage/(import|logs|framework|debugbar)/ {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # ponytail: resolver+variable forces runtime DNS lookup instead of
        # resolving "app" once at nginx startup, which races the container's
        # network attach and made this service exit on boot.
        resolver 127.0.0.11 valid=10s;
        set $upstream_app app;
        fastcgi_pass $upstream_app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
